; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3box

[env:esp32s3box]
platform = espressif32@6.8.0
board = esp32s3box
framework = arduino
upload_speed = 115200
board_build.partitions = default_16MB.csv
build_flags =
    -D GH_INCLUDE_PORTAL
    -D GH_NO_STREAM
    -D FASTLED_ESP32_FLASH_LOCK=1
    -D FASTLED_RMT_MAX_TICKS_FOR_GTX_SEM=500
    !echo '-D GIT_REV=\"'$(git rev-parse --short HEAD 2>/dev/null || echo nogit)'\"'


lib_deps = 
	https://github.com/tzapu/WiFiManager.git
	FastLED
	me-no-dev/AsyncTCP@^1.1.1
	me-no-dev/ESP Async WebServer@^1.2.4
    https://github.com/GyverLibs/GyverHub.git
    https://github.com/GyverLibs/FileData.git

; host unit tests for lib/ (pure logic): pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
